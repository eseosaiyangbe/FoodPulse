name: Promote FoodPulse Images To Prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable app image tag to promote for both FoodPulse images (for example git-5100dfd)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      REGISTRY: docker.io
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image repositories
        id: image_repo
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_API_REPOSITORY: ${{ vars.DOCKERHUB_API_REPOSITORY }}
          DOCKERHUB_UI_REPOSITORY: ${{ vars.DOCKERHUB_UI_REPOSITORY }}
        run: |
          set -eu

          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "DOCKERHUB_USERNAME GitHub variable is required" >&2
            exit 1
          fi

          API_REPOSITORY="${DOCKERHUB_API_REPOSITORY:-foodpulse-api}"
          UI_REPOSITORY="${DOCKERHUB_UI_REPOSITORY:-foodpulse-ui}"
          echo "api_image_name=${DOCKERHUB_USERNAME}/${API_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "ui_image_name=${DOCKERHUB_USERNAME}/${UI_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Validate immutable image tag format
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -eu
          case "$IMAGE_TAG" in
            git-*) ;;
            *)
              echo "Prod promotion currently only accepts immutable git-<sha> tags" >&2
              exit 1
              ;;
          esac

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify API and UI images exist in registry
        env:
          API_IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.image_repo.outputs.api_image_name }}
          UI_IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.image_repo.outputs.ui_image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -eu
          docker manifest inspect "${API_IMAGE_NAME}:${IMAGE_TAG}" > /dev/null
          docker manifest inspect "${UI_IMAGE_NAME}:${IMAGE_TAG}" > /dev/null

      - name: Update prod overlay image tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -eu
          python3 - <<'PY_INNER'
          from pathlib import Path
          import os

          path = Path("k8s/overlays/prod/kustomization.yaml")
          image_tag = os.environ["IMAGE_TAG"]
          lines = path.read_text().splitlines()

          target_names = {
              "foodpulse-api": False,
              "foodpulse-ui": False,
          }
          current_name = None

          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped == "- name: foodpulse-api":
                  current_name = "foodpulse-api"
                  continue
              if stripped == "- name: foodpulse-ui":
                  current_name = "foodpulse-ui"
                  continue
              if current_name and stripped.startswith("newTag:"):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index] = f"{indent}newTag: {image_tag}"
                  target_names[current_name] = True
                  current_name = None

          if not all(target_names.values()):
              raise SystemExit("Failed to update both prod image tags in kustomization.yaml")

          path.write_text("\n".join(lines) + "\n")
          PY_INNER

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Run prod kustomize render check
        run: kubectl kustomize k8s/overlays/prod > /dev/null

      - name: Create prod promotion pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Promote FoodPulse images to ${{ inputs.image_tag }}
          title: Promote FoodPulse images to ${{ inputs.image_tag }}
          body: |
            ## Promotion Summary

            - target image tag: `${{ inputs.image_tag }}`
            - workflow: `Promote FoodPulse Images To Prod`
            - promotion style: Git change only
            - cluster mutation: none

            ## Validation Performed

            - immutable tag format check
            - Docker Hub image existence check for API and UI
            - prod overlay render check with `kubectl kustomize`

            ## Next Step

            - review and merge this PR to let Argo CD reconcile prod from Git
          branch: ci/promote-prod-${{ inputs.image_tag }}
          delete-branch: true
          labels: |
            release
            prod-promotion
          base: main

      - name: Summarize promotion outcome
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF_SUMMARY'
          ## Prod promotion workflow

          - immutable prod promotion tag requested: `${{ inputs.image_tag }}`
          - registry image existence was verified for both FoodPulse app images before changing Git
          - prod overlay render was validated with `kubectl kustomize`
          - a promotion pull request was created instead of mutating the cluster directly
          EOF_SUMMARY
