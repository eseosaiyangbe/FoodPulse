name: Validate Repository

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "api/**"
      - "ui/**"
      - "k8s/**"
      - "scripts/**"
      - ".yamllint.yml"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - ".github/workflows/**"
      - "api/**"
      - "ui/**"
      - "k8s/**"
      - "scripts/**"
      - ".yamllint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            api/package-lock.json
            ui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Install validation tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install --upgrade pip
          python -m pip install yamllint

          ACTIONLINT_VERSION=1.7.7
          curl -sSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tgz -C /tmp
          sudo install /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          actionlint

      - name: Lint shell scripts
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          shell_scripts=()
          if [ -n "${DIFF_BASE:-}" ] && git rev-parse --verify "${DIFF_BASE}^{commit}" >/dev/null 2>&1; then
            mapfile -t shell_scripts < <(
              git diff --name-only "${DIFF_BASE}" "${DIFF_HEAD}" -- \
                'scripts/*.sh' 'scripts/**/*.sh' \
                'k8s/base/*.sh' 'k8s/base/**/*.sh' | sort -u
            )
          fi
          if [ "${#shell_scripts[@]}" -eq 0 ] && [ -f scripts/smoke-dev.sh ]; then
            shell_scripts=(scripts/smoke-dev.sh)
          fi
          if [ "${#shell_scripts[@]}" -gt 0 ]; then
            shellcheck "${shell_scripts[@]}"
            for script in "${shell_scripts[@]}"; do
              bash -n "${script}"
            done
          fi

      - name: Install API dependencies
        run: npm --prefix api ci

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Validate API entrypoint syntax
        run: node --check api/src/index.js

      - name: Build UI
        run: npm --prefix ui run build

      - name: Lint YAML files
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          yaml_files=()
          if [ -n "${DIFF_BASE:-}" ] && git rev-parse --verify "${DIFF_BASE}^{commit}" >/dev/null 2>&1; then
            mapfile -t yaml_files < <(
              git diff --name-only "${DIFF_BASE}" "${DIFF_HEAD}" -- \
                '.github/workflows/*.yml' '.github/workflows/*.yaml' \
                'k8s/**/*.yml' 'k8s/**/*.yaml' \
                'scripts/**/*.yml' 'scripts/**/*.yaml' | sort -u
            )
          fi
          if [ "${#yaml_files[@]}" -gt 0 ]; then
            python -m yamllint -c .yamllint.yml -s "${yaml_files[@]}"
          fi

      - name: Render Kubernetes manifests
        run: |
          set -euo pipefail
          kubectl kustomize k8s/base >/tmp/foodpulse-base.yaml
          kubectl kustomize k8s/overlays/dev >/tmp/foodpulse-dev.yaml
          kubectl kustomize k8s/overlays/prod >/tmp/foodpulse-prod.yaml

      - name: Client dry-run Kubernetes manifests
        run: |
          set -euo pipefail
          kubectl apply --dry-run=client --validate=false -k k8s/overlays/dev >/tmp/foodpulse-dev-dryrun.txt
          kubectl apply --dry-run=client --validate=false -k k8s/overlays/prod >/tmp/foodpulse-prod-dryrun.txt
          kubectl apply --dry-run=client --validate=false -f k8s/argocd/foodpulse-dev-application.yaml >/tmp/foodpulse-argocd-dev-dryrun.txt
          kubectl apply --dry-run=client --validate=false -f k8s/argocd/foodpulse-prod-application.yaml >/tmp/foodpulse-argocd-prod-dryrun.txt

      - name: Summarize validation coverage
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Validation Coverage

          - GitHub Actions workflow linting via `actionlint`
          - Shell script linting via `shellcheck` and `bash -n`
          - Node dependency installation for API and UI
          - API syntax validation via `node --check`
          - UI build validation via `vite build`
          - YAML linting via `yamllint`
          - `kubectl kustomize` render checks for base, dev, and prod overlays
          - `kubectl apply --dry-run=client` checks for dev, prod, and ArgoCD application manifests
          EOF
