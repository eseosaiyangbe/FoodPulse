apiVersion: batch/v1
kind: CronJob
metadata:
  name: foodpulse-state-backup
  namespace: foodpulse-dev
spec:
  schedule: "0 4 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            backup-role: state-backup
            app.kubernetes.io/name: foodpulse-state-backup
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: prepare-timestamp
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
              command:
                - sh
                - -ec
                - |
                  date -u +%Y%m%dT%H%M%SZ > /meta/timestamp
              volumeMounts:
                - name: backup-meta
                  mountPath: /meta
          containers:
            - name: postgres-backup
              image: postgres:18-alpine
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              env:
                - name: PGHOST
                  valueFrom:
                    configMapKeyRef:
                      name: foodpulse-app-config
                      key: FOODPULSE_DB_SERVER
                - name: PGPORT
                  valueFrom:
                    configMapKeyRef:
                      name: foodpulse-app-config
                      key: FOODPULSE_DB_PORT
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: foodpulse-postgres-app
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: foodpulse-postgres-app
                      key: password
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: foodpulse-app-config
                      key: FOODPULSE_DB_NAME
                - name: KEEP_BACKUPS
                  value: "7"
              command:
                - sh
                - -ec
                - |
                  ts="$(cat /meta/timestamp)"
                  target="/backup/foodpulse-postgres-${ts}.dump"
                  tmp="${target}.tmp"

                  echo "Waiting for PostgreSQL at ${PGHOST}:${PGPORT}"
                  for _ in $(seq 1 60); do
                    if pg_isready -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" >/dev/null 2>&1; then
                      break
                    fi
                    sleep 2
                  done

                  echo "Starting PostgreSQL backup to ${target}"
                  pg_dump \
                    --host="${PGHOST}" \
                    --port="${PGPORT}" \
                    --username="${PGUSER}" \
                    --dbname="${PGDATABASE}" \
                    --format=custom \
                    --clean \
                    --if-exists \
                    --no-owner \
                    --no-privileges \
                    --file="${tmp}"

                  [ -s "${tmp}" ]
                  mv "${tmp}" "${target}"

                  keep="${KEEP_BACKUPS:-7}"
                  if [ "${keep}" -gt 0 ] 2>/dev/null; then
                    ls -1t /backup/foodpulse-postgres-*.dump 2>/dev/null | tail -n +"$((keep + 1))" | xargs -r rm -f
                  fi

                  ls -lh /backup/foodpulse-postgres-*.dump 2>/dev/null || true
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
                - name: backup-meta
                  mountPath: /meta
            - name: redis-backup
              image: redis:7.2-alpine
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: foodpulse-app-secrets
                      key: FOODPULSE_REDIS_PASSWORD
                - name: KEEP_BACKUPS
                  value: "7"
                - name: REDIS_HOST
                  value: foodpulse-redis-0.foodpulse-redis-headless.foodpulse-dev.svc.cluster.local
              command:
                - sh
                - -ec
                - |
                  ts="$(cat /meta/timestamp)"
                  target="/backup/foodpulse-redis-${ts}.rdb"
                  tmp="${target}.tmp"

                  echo "Waiting for Redis primary at ${REDIS_HOST}:6379"
                  for _ in $(seq 1 60); do
                    if REDISCLI_AUTH="${REDIS_PASSWORD}" redis-cli -h "${REDIS_HOST}" ping >/dev/null 2>&1; then
                      break
                    fi
                    sleep 2
                  done

                  echo "Starting Redis backup to ${target}"
                  redis-cli -h "${REDIS_HOST}" -a "${REDIS_PASSWORD}" --rdb "${tmp}"

                  [ -s "${tmp}" ]
                  mv "${tmp}" "${target}"

                  keep="${KEEP_BACKUPS:-7}"
                  if [ "${keep}" -gt 0 ] 2>/dev/null; then
                    ls -1t /backup/foodpulse-redis-*.rdb 2>/dev/null | tail -n +"$((keep + 1))" | xargs -r rm -f
                  fi

                  ls -lh /backup/foodpulse-redis-*.rdb 2>/dev/null || true
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
                - name: backup-meta
                  mountPath: /meta
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: foodpulse-backup-storage
            - name: backup-meta
              emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: foodpulse-backup-storage
  namespace: foodpulse-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
